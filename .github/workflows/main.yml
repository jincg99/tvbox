name: 更新直播源

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时跑一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行合并脚本
        run: python merge.py

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt
          git diff --staged --quiet || git commit -m "自动更新直播源 $(date '+%Y-%m-%d %H:%M')"
          git push
