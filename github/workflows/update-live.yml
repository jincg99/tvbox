name: update live source

on:
  schedule:
    - cron: "0 * * * *"   # 每小时启动一次；每次运行内部每 3 分钟更新一次
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个，后一个排队等待，不会互相打断
concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install requests

      - name: run merge script every 3 minutes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + 57*60))
          while true; do
            OLD=$(wc -l < live.txt)
            python merge.py || echo "merge failed, keeping old live.txt"
            NEW=$(wc -l < live.txt)
            # 所有源临时失效时 merge.py 会写出很小的文件，这里拦截，避免覆盖好列表
            if [ "$NEW" -lt $((OLD / 2)) ]; then
              echo "live.txt shrank from $OLD to $NEW lines, discarding"
              git checkout -- live.txt
            fi
            git add live.txt
            if ! git diff --cached --quiet; then
              git commit -m "auto update live source"
              git pull --rebase -q origin "$GITHUB_REF_NAME" || true
              git push || true
            fi
            [ "$SECONDS" -ge "$END" ] && break
            sleep 180
          done
